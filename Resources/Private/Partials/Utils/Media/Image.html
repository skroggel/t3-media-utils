<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:mediaUtils="http://typo3.org/ns/Madj2k/MediaUtils/ViewHelpers"
	  data-namespace-typo3-fluid="true">

    <f:variable name="innerClass" value="{innerClass} {classInner} {classInnerImage}" />
    <f:if condition="{file} || {src} || {settings.media.image.fallback}">
        <figure class="img {wrapClass}">
            <f:link.typolink class="link link-image" parameter="{link}">
                <div class="img-inner {innerClass}">
                    <f:render section="Inner" arguments="{_all}" />
                    <f:if condition="{textOverlay}">
                        <div class="img-overlay">
                            <div class="img-overlay-text">
                                <span>{textOverlay}</span>
                            </div>
                        </div>
                    </f:if>
                    <f:if condition="{file.title} && {settings.txMediaUtils.responsiveImages.showSourceViaTitle}">
                        <small class="img-source">
                            {file.title}
                        </small>
                    </f:if>
                </div>
            </f:link.typolink>
            <f:if condition="{caption} || {file.description}">
                <figcaption class="img-caption">
                    <f:if condition="{caption}">
                        <f:then>{caption -> f:format.raw()}</f:then>
                        <f:else>{file.description}</f:else>
                    </f:if>
                </figcaption>
            </f:if>
        </figure>
    </f:if>
    <f:comment><!-- ================================================================================== --></f:comment>

    <f:section name="Inner">
        <f:variable name="internalAspectRatioClass"><f:if condition="{aspectRatio}"><mediaUtils:file.cropVariantClass file="{file}" bootstrap="false"/></f:if></f:variable>

        <mediaUtils:responsiveImages.image
            class="{class} {internalAspectRatioClass}"
            image="{file}"
            src="{src}"
            width="{width}"
            height="{height}"
            minWidth="{minWidth}"
            minHeight="{minHeight}"
            maxWidth="{maxWidth}"
            maxHeight="{maxHeight}"
            alt="{alternative}"
            title="{title}"

            srcset="{srcset}"
            lazyload="{lazyload}"
            placeholderSize="{placeholderSize}"
            placeholderInline="{placeholderInline}"
            sizes="{sizes}"
            breakpoints="{breakpoints}"
            ignoreFileExtensions="{ignoreFileExtensions}"
            fileExtension="{fileExtension}"
            loading="{loading}"
            decoding="{fileDecoding}"
            renderHeightAttribute="{renderHeightAttribute}"

            additionalAttributes="{fetchPriority: fetchPriority}"
            settings="{settings}"
            settingsVariant="{settingsVariant}"
        />

    </f:section>
</html>
